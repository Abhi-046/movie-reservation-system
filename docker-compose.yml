services:

  postgres:
    image: postgres:16

    container_name: movie_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie_booking

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: movie_redis

    restart: always

    ports:
      - "6379:6379"

  api:
    build:
      context: ./server

    container_name: movie_api

    restart: always

    env_file:
      - ./server/.env

    ports:
      - "5000:5000"

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: